<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyLink Voyages — Onward Reservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --petrol-950:#050f22;
    --petrol-900:#0b1f3a;
    --petrol-800:#132c4d;
    --teal-600:#1f4e82;
    --teal-500:#2c63a3;
    --teal-100:#e8eef7;
    --gold-500:#c9a227;
    --gold-400:#d9b94a;
    --cream:#f7f4ee;
    --ink:#0e1c2e;
    --ink-soft:#4a6068;
    --line:#dde3e0;
    --white:#ffffff;
    --danger:#b5493a;
    --ok:#2e7d5b;
    --warn:#c98b1f;
    --radius:14px;
    --shadow-lg:0 24px 60px -20px rgba(7,34,44,0.35);
    --shadow-sm:0 4px 16px -6px rgba(7,34,44,0.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--gold-400);color:var(--petrol-950);}

  /* ---------- Layout shell ---------- */
  .app-header{
    position:sticky;top:0;z-index:100;
    background:var(--petrol-950);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .header-inner{
    max-width:1180px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .logo{display:flex;align-items:center;gap:10px;color:var(--white);}
  .logo-mark{
    height:38px;width:auto;display:block;flex:none;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .logo-mark.lg{height:64px;}
  .logo-text{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:0.01em;}
  .logo-text small{display:block;font-family:'Inter';font-weight:500;font-size:9.5px;letter-spacing:0.08em;color:var(--gold-400);text-transform:uppercase;margin-top:1px;white-space:nowrap;}
  nav.main-nav{display:flex;align-items:center;gap:6px;}
  nav.main-nav a{
    color:rgba(255,255,255,0.72);font-size:14.5px;font-weight:500;
    padding:9px 14px;border-radius:8px;transition:.15s;
  }
  nav.main-nav a:hover{color:var(--white);background:rgba(255,255,255,0.06);}
  nav.main-nav a.active{color:var(--petrol-950);background:var(--gold-400);}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .lang-toggle{
    display:flex;background:rgba(255,255,255,0.08);border-radius:999px;padding:3px;
  }
  .lang-toggle button{
    border:none;background:transparent;color:rgba(255,255,255,0.6);
    padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.03em;
  }
  .lang-toggle button.active{background:var(--white);color:var(--petrol-950);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:9px;border:none;font-size:14.5px;font-weight:700;
    transition:.15s ease;white-space:nowrap;
  }
  .btn-primary{background:var(--gold-500);color:var(--petrol-950);}
  .btn-primary:hover{background:var(--gold-400);transform:translateY(-1px);}
  .btn-ghost-dark{background:rgba(255,255,255,0.1);color:var(--white);}
  .btn-ghost-dark:hover{background:rgba(255,255,255,0.18);}
  .btn-outline{background:transparent;border:1.5px solid var(--petrol-900);color:var(--petrol-900);}
  .btn-outline:hover{background:var(--petrol-900);color:var(--white);}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}
  .mobile-toggle{display:none;background:none;border:none;color:var(--white);font-size:22px;}

  main{min-height:70vh;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  footer{background:var(--petrol-950);color:rgba(255,255,255,0.55);padding:48px 24px 28px;margin-top:80px;}
  .footer-inner{max-width:1180px;margin:0 auto;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .footer-grid h4{color:var(--white);font-family:'Inter';font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;}
  .footer-grid a{display:block;font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:9px;}
  .footer-grid a:hover{color:var(--gold-400);}
  .footer-bottom{padding-top:20px;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  /* ---------- Hero ---------- */
  .hero{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(37,150,168,0.35), transparent),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(201,162,39,0.18), transparent),
      linear-gradient(180deg,var(--petrol-950) 0%, var(--petrol-900) 100%);
    color:var(--white);
    padding:64px 24px 0;
    position:relative;
    overflow:hidden;
  }
  .hero-inner{max-width:1180px;margin:0 auto;position:relative;z-index:2;}
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold-400);background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.3);
    padding:7px 14px;border-radius:999px;margin-bottom:22px;
  }
  .hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.06;max-width:760px;font-weight:600;}
  .hero h1 em{font-style:normal;color:var(--gold-400);}
  .hero p.lead{font-size:17px;color:rgba(255,255,255,0.68);max-width:560px;margin-top:18px;line-height:1.6;}

  /* route strip signature */
  .route-strip{
    margin:34px 0 0; display:flex; align-items:center; gap:14px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:rgba(255,255,255,0.5);
  }
  .route-strip .dots{flex:1;height:1px;position:relative;background:repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px);}
  .route-strip .plane{color:var(--gold-400);font-size:16px;transform:translateY(-1px);}

  .search-card{
    background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);
    padding:22px;margin-top:38px;position:relative;z-index:3;
    display:grid;grid-template-columns:repeat(4,1fr) auto;gap:14px;align-items:end;
    transform:translateY(50%);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .field select,.field input{
    border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14.5px;
    font-family:inherit;color:var(--ink);background:var(--white);
  }
  .field select:focus,.field input:focus{outline:none;border-color:var(--teal-500);}
  .hero-bottom-pad{height:120px;}

  /* trip type pills inside search card (spans full row above) */
  .trip-type-row{grid-column:1 / -1;display:flex;gap:8px;margin-bottom:2px;}
  .pill{
    padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--white);
  }
  .pill.active{border-color:var(--teal-600);color:var(--teal-600);background:var(--teal-100);}

  /* ---------- Sections generic ---------- */
  section.block{padding:70px 0;}
  .section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
  .section-head .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-600);margin-bottom:10px;display:block;}
  .section-head h2{font-size:clamp(26px,3.4vw,36px);}
  .section-head p{color:var(--ink-soft);font-size:15.5px;margin-top:12px;line-height:1.6;}

  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:step;}
  .step-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 26px;position:relative;
  }
  .step-num{
    font-family:'Fraunces',serif;font-size:38px;color:var(--teal-100);font-weight:700;
    -webkit-text-stroke:1.5px var(--teal-500);color:transparent;
    line-height:1;margin-bottom:14px;
  }
  .step-card h3{font-size:17px;margin-bottom:8px;}
  .step-card p{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0;}
  .step-connector{position:absolute;top:36px;right:-28px;width:28px;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);}
  .step-card:last-child .step-connector{display:none;}

  .trust-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;}
  .trust-card{background:var(--petrol-950);color:var(--white);border-radius:18px;padding:36px;position:relative;overflow:hidden;}
  .trust-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(37,150,168,0.35),transparent 60%);}
  .trust-card h3{position:relative;font-size:21px;margin-bottom:14px;}
  .trust-card p{position:relative;font-size:14.5px;color:rgba(255,255,255,0.72);line-height:1.65;}
  .trust-tag{
    position:relative;display:inline-block;margin-top:18px;
    font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.04em;
    color:var(--gold-400);border:1px solid rgba(201,162,39,0.4);padding:6px 12px;border-radius:6px;
  }
  .trust-list{display:flex;flex-direction:column;gap:20px;}
  .trust-item{display:flex;gap:14px;}
  .trust-icon{
    width:38px;height:38px;flex:none;border-radius:9px;background:var(--teal-100);
    display:flex;align-items:center;justify-content:center;color:var(--teal-600);font-weight:700;
  }
  .trust-item h4{font-size:15px;margin-bottom:4px;}
  .trust-item p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.5;}

  .disclaimer-bar{
    background:#fbf3e2;border:1px solid #ecd8a4;color:#7a5a12;
    border-radius:11px;padding:14px 18px;font-size:13px;line-height:1.55;display:flex;gap:10px;
  }
  .disclaimer-bar b{color:#5f4409;}

  /* ---------- Cards / tables generic ---------- */
  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
  .badge-dot{width:6px;height:6px;border-radius:50%;}
  .badge.pending{background:#fdf1de;color:#96650f;}
  .badge.pending .badge-dot{background:#c98b1f;}
  .badge.paid{background:#e6f1fb;color:#1f5fa8;}
  .badge.paid .badge-dot{background:#2f7fd0;}
  .badge.searching{background:#eee7fb;color:#5b3fa8;}
  .badge.searching .badge-dot{background:#7a54d6;}
  .badge.confirmed{background:#e6f4ec;color:#1f7a4c;}
  .badge.confirmed .badge-dot{background:#2e9c5f;}
  .badge.expired{background:#f1f1ef;color:#767671;}
  .badge.expired .badge-dot{background:#9a9a94;}
  .badge.cancelled{background:#fbe9e6;color:#a83a26;}
  .badge.cancelled .badge-dot{background:#c94b34;}

  /* ---------- Booking wizard ---------- */
  .wizard-shell{background:var(--white);min-height:100vh;}
  .wizard-top{background:var(--petrol-950);padding:20px 0;}
  .wizard-top .wrap{display:flex;align-items:center;justify-content:space-between;}
  .progress-track{display:flex;align-items:center;gap:6px;max-width:640px;margin:0 auto;padding:26px 24px 0;}
  .progress-step{flex:1;height:4px;border-radius:99px;background:var(--line);}
  .progress-step.done{background:var(--teal-600);}
  .progress-step.current{background:var(--gold-500);}
  .wizard-body{max-width:640px;margin:0 auto;padding:34px 24px 90px;}
  .step-label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-600);margin-bottom:8px;}
  .wizard-body h2{font-size:26px;margin-bottom:26px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-grid .full{grid-column:1/-1;}
  .field-block{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
  .field-block label{font-size:12.5px;font-weight:700;color:var(--ink);}
  .field-block .hint{font-size:12px;color:var(--ink-soft);font-weight:400;margin-top:-2px;}
  .field-block input,.field-block select{
    border:1.5px solid var(--line);border-radius:9px;padding:12px 13px;font-size:14.5px;font-family:inherit;
  }
  .field-block input:focus,.field-block select:focus{outline:none;border-color:var(--teal-500);}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:8px;}
  .choice-card{
    border:1.5px solid var(--line);border-radius:11px;padding:16px 14px;cursor:pointer;transition:.15s;
  }
  .choice-card:hover{border-color:var(--teal-500);}
  .choice-card.selected{border-color:var(--teal-600);background:var(--teal-100);}
  .choice-card .cc-title{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .choice-card .cc-sub{font-size:12.5px;color:var(--ink-soft);}
  .wizard-nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px;}

  .flight-option{
    border:1.5px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .flight-option:hover{border-color:var(--teal-500);}
  .flight-option.selected{border-color:var(--teal-600);background:var(--teal-100);}
  .fo-route{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono';font-size:14px;font-weight:600;}
  .fo-route .arrow{color:var(--teal-600);}
  .fo-meta{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .fo-price{font-family:'Fraunces';font-weight:700;font-size:19px;color:var(--petrol-900);text-align:right;}
  .fo-tag{font-size:10.5px;color:var(--ink-soft);text-align:right;}
  .fo-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .fo-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--teal-100);color:var(--teal-600);}
  .fo-badge.best{background:var(--gold-400);color:var(--petrol-950);}
  .expiry-note{font-size:12.5px;color:var(--warn);font-weight:600;margin:-6px 0 16px;}
  .fo-avatar{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;color:var(--white);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:700;font-size:12px;
  }
  .fo-main{flex:1;min-width:0;}
  .flight-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .filter-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-btn{
    font-family:'Inter';font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;
    border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);cursor:pointer;transition:.15s;
  }
  .pill-btn:hover{border-color:var(--teal-500);}
  .pill-btn.active{border-color:var(--teal-600);background:var(--teal-600);color:var(--white);}
  .sort-select{
    font-family:'Inter';font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;
  }
  .result-count{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .empty-state{padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .summary-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .label{color:var(--ink-soft);}
  .summary-row .val{font-weight:600;}
  .summary-total{display:flex;justify-content:space-between;padding-top:14px;margin-top:6px;border-top:1.5px solid var(--ink);font-size:18px;font-weight:700;}

  .boarding-card{
    background:var(--petrol-950);color:var(--white);border-radius:16px;overflow:hidden;position:relative;
  }
  .bc-top{padding:26px 26px 20px;display:flex;justify-content:space-between;align-items:flex-start;}
  .bc-brand{font-family:'Fraunces';font-size:15px;color:var(--gold-400);letter-spacing:.02em;}
  .bc-status{font-family:'IBM Plex Mono';font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid rgba(201,162,39,.5);color:var(--gold-400);}
  .bc-route{padding:0 26px;display:flex;align-items:center;gap:16px;}
  .bc-city{font-family:'Fraunces';font-size:30px;font-weight:600;}
  .bc-code{font-family:'IBM Plex Mono';font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;}
  .bc-plane{flex:1;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.3) 0 6px,transparent 6px 12px);position:relative;}
  .bc-plane::after{content:"✈";position:absolute;top:-9px;right:0;color:var(--gold-400);font-size:15px;}
  .bc-perf{
    margin:24px 0 0;height:0;border-top:2px dashed rgba(255,255,255,0.2);position:relative;
  }
  .bc-perf::before,.bc-perf::after{
    content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--cream);
  }
  .bc-perf::before{left:-9px;}
  .bc-perf::after{right:-9px;}
  .bc-bottom{padding:22px 26px 26px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .bc-field{font-family:'IBM Plex Mono';}
  .bc-field .k{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .bc-field .v{font-size:13.5px;font-weight:600;}

  .confirm-actions{display:flex;gap:12px;margin-top:26px;}

  /* ---------- Client space ---------- */
  .page-head{background:var(--petrol-950);color:var(--white);padding:44px 0 60px;}
  .page-head h1{font-size:29px;}
  .page-head p{color:rgba(255,255,255,0.6);margin-top:8px;font-size:14.5px;}
  .content-lift{margin-top:-38px;padding-bottom:70px;}
  .res-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:20px;
    box-shadow:var(--shadow-sm);
  }
  .res-left{display:flex;align-items:center;gap:18px;}
  .res-icon{
    width:46px;height:46px;border-radius:11px;background:var(--teal-100);color:var(--teal-600);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:700;font-size:17px;flex:none;
  }
  .res-route{font-weight:700;font-size:15.5px;}
  .res-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono';}
  .res-right{display:flex;align-items:center;gap:14px;}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .ei{font-size:34px;margin-bottom:10px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);}
  .stat-card .sc-label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .sc-value{font-family:'Fraunces';font-size:28px;margin-top:8px;font-weight:600;}
  .stat-card .sc-delta{font-size:12px;margin-top:6px;font-weight:600;}
  .sc-delta.up{color:var(--ok);}
  .sc-delta.down{color:var(--danger);}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);

/* ---------------- Backend SkyLink (recherche de vols + réservation réelle via Duffel) ---------------- */
const API_BASE = 'https://skylink-backend-xm8o.onrender.com';
function extractIata(cityLabel){
  const m = /\(([A-Z]{3})\)/.exec(cityLabel || '');
  return m ? m[1] : cityLabel;
}
function formatTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleTimeString(LANG==='fr'?'fr-FR':'en-GB', {hour:'2-digit', minute:'2-digit'});
}
function formatDuration(min){
  if (!min && min !== 0) return '';
  const h = Math.floor(min/60), m = min%60;
  return `${h}h${String(m).padStart(2,'0')}`;
}
function formatStops(stops, lang){
  if (!stops) return lang==='fr' ? 'Direct' : 'Direct';
  return lang==='fr' ? `${stops} escale${stops>1?'s':''}` : `${stops} stop${stops>1?'s':''}`;
}
function airlineInitials(flightNo){
  const m = /^([A-Z]{2,3})/.exec(flightNo || '');
  return m ? m[1].slice(0,2) : '✈';
}
const AVATAR_PALETTE = ['#0b1f3a','#132c4d','#2c63a3','#a5811d','#2e7d5b','#8a3b2c','#5b3b8a','#1f4e82'];
function airlineColor(flightNo){
  const code = airlineInitials(flightNo);
  let hash = 0;
  for (let i=0;i<code.length;i++) hash = (hash*31 + code.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(hash)];
}

/* ---------------- Demo data store ---------------- */
const CITIES = ["Casablanca (CMN)","Paris (CDG)","Dubai (DXB)","Londres (LHR)","Istanbul (IST)","Montréal (YUL)","New York (JFK)","Dakar (DSS)","Le Caire (CAI)","Madrid (MAD)","Nouakchott (NKC)","Doha (DOH)","Bahreïn (BAH)","Belgrade (BEG)","Sarajevo (SJJ)","Tunis (TUN)","Bamako (BKO)","Abidjan (ABJ)","Conakry (CKY)","Addis-Abeba (ADD)","Nairobi (NBO)"];
const AIRLINES = [
  {code:"AT", name:"Royal Air Maroc"},
  {code:"TK", name:"Turkish Airlines"},
  {code:"EK", name:"Emirates"},
  {code:"AF", name:"Air France"},
  {code:"QR", name:"Qatar Airways"}
];

function loadDB(){
  const raw = localStorage.getItem('sv_bookings');
  return raw ? JSON.parse(raw) : [];
}
function saveDB(list){ localStorage.setItem('sv_bookings', JSON.stringify(list)); }

function genPNR(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genFlightNo(code){ return code + (100 + Math.floor(Math.random()*800)); }

function seedDemoIfEmpty(){
  let db = loadDB();
  if(db.length) return;
  const statuses = ["confirmed","paid","searching","expired"];
  const now = Date.now();
  db = [1,2,3].map((n,i)=>{
    const al = AIRLINES[i % AIRLINES.length];
    const created = now - i*86400000*2;
    return {
      id:"SV-"+(1000+i),
      firstName:"Amine", lastName:"Benkirane",
      from: CITIES[0], to: CITIES[i+1],
      date: new Date(now + 5*86400000).toISOString().slice(0,10),
      pnr: genPNR(),
      flightNo: genFlightNo(al.code),
      airline: al.name,
      status: statuses[i % statuses.length],
      createdAt: created,
      expiresAt: created + 36*3600000,
      price: 39 + i*10,
      email:"amine.b@example.com", whatsapp:"+212 6 00 00 00 0"+i
    };
  });
  saveDB(db);
}
seedDemoIfEmpty();

/* ---------------- Router ---------------- */
const routes = {};
function route(path, fn){ routes[path] = fn; }
function navigate(){
  const hash = location.hash.replace('#','') || '/';
  const base = '/' + hash.split('/').filter(Boolean)[0] ? '/' + hash.split('/').filter(Boolean)[0] : '/';
  const handler = routes[base] || routes['/'];
  document.getElementById('app').scrollTo?.(0,0);
  window.scrollTo(0,0);
  handler(hash);
  renderChrome();
}
window.addEventListener('hashchange', navigate);

/* ---------------- Chrome (header nav/footer) ---------------- */
function renderChrome(){
  const hash = location.hash.replace('#','') || '/';
  const navItems = [
    ['/', 'nav_home'], ['/reserver','nav_book'], ['/espace-client','nav_client'], ['/admin','nav_admin']
  ];
  const mainNav = document.getElementById('mainNav');
  mainNav.innerHTML = navItems.map(([href,key])=>{
    const active = (href === '/' && hash === '/') || (href!=='/' && hash.startsWith(href));
    return `<a href="#${href}" class="${active?'active':''}">${t(key)}</a>`;
  }).join('');

  const mobileNav = document.getElementById('mobileNav');
  mobileNav.innerHTML = navItems.map(([href,key])=>`<a href="#${href}">${t(key)}</a>`).join('')
    + `<a href="#" id="mobileClose" style="margin-top:20px;color:#c9a227;">✕ ${LANG==='fr'?'Fermer':'Close'}</a>`;
  document.getElementById('mobileClose').onclick = (e)=>{e.preventDefault();document.getElementById('mobileNav').classList.remove('open');};

  document.getElementById('langFr').classList.toggle('active', LANG==='fr');
  document.getElementById('langEn').classList.toggle('active', LANG==='en');

  document.getElementById('footerGrid').innerHTML = `
    <div><div class="logo" style="margin-bottom:14px;"><img class="logo-mark" src="${LOGO_URI}" alt="SkyLink Voyages"><span class="logo-text" style="color:#fff;">SkyLink Voyages</span></div>
      <p style="font-size:13.5px;line-height:1.6;max-width:280px;">${t('f_col1')}</p></div>
    <div><h4>${t('f_col2_h')}</h4><a href="#/reserver">${t('f_col2_1')}</a><a href="#/">${t('f_col2_2')}</a><a href="#/espace-client">${t('f_col2_3')}</a></div>
    <div><h4>${t('f_col3_h')}</h4><a href="#">${t('f_col3_1')}</a><a href="#">${t('f_col3_2')}</a><a href="#">${t('f_col3_3')}</a></div>
    <div><h4>${t('f_col4_h')}</h4><a href="#">${t('f_col4_1')}</a><a href="#">${t('f_col4_2')}</a><a href="#">${t('f_col4_3')}</a></div>
  `;
}

/* ---------------- Toast / modal helpers ---------------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2800);
}
function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click',(e)=>{
  if(e.target.id==='modalOverlay') closeModal();
});

/* ---------------- Formatting ---------------- */
function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleString(LANG==='fr'?'fr-FR':'en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function statusBadge(status){
  const map = {pending:'status_pending',paid:'status_paid',searching:'status_searching',confirmed:'status_confirmed',expired:'status_expired',cancelled:'status_cancelled'};
  return `<span class="badge ${status}"><span class="badge-dot"></span>${t(map[status])}</span>`;
}

/* ================= BOOKING WIZARD ================= */
const WIZ_STEPS = 7;
const WIZ_DEFAULTS = {
  step:1, type:'oneway', from:CITIES[0], to:CITIES[1], date:new Date(Date.now()+7*86400000).toISOString().slice(0,10),
  returnDate:new Date(Date.now()+14*86400000).toISOString().slice(0,10),
  existingPnr:'', firstName:'', lastName:'', email:'', whatsapp:'', birthDate:'', gender:'m',
  flight:null, returnFlight:null, tripPhase:'outbound', booking:null
};
let wizState = { ...WIZ_DEFAULTS };
function resetWizard(){
  wizState = { ...WIZ_DEFAULTS };
}

function demoFlights(){
  return AIRLINES.slice(0,4).map((al,i)=>({
    airline: al.name, code: al.code, flightNo: genFlightNo(al.code),
    depTime: ["06:20","10:45","14:10","21:05"][i], arrTime: ["09:35","13:55","17:30","23:50"][i],
    price: 29 + i*8
  }));
}
let currentFlightOptions = [];
let flightUiState = { filter: 'all', sort: 'price', visibleCount: 8 };

function getFilteredSortedFlights(){
  let list = currentFlightOptions.slice();
  if (flightUiState.filter === 'direct') list = list.filter(f => !f.stops);
  else if (flightUiState.filter === 'stops') list = list.filter(f => f.stops);
  if (flightUiState.sort === 'duration') list.sort((a,b) => (a.durationMin ?? 0) - (b.durationMin ?? 0));
  else list.sort((a,b) => Number(a.price) - Number(b.price));
  return list;
}

function renderFlightList(){
  const list = document.getElementById('flightList');
  const countEl = document.getElementById('flightResultCount');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const filtered = getFilteredSortedFlights();
  const cheapestPrice = currentFlightOptions.length ? Math.min(...currentFlightOptions.map(f => Number(f.price))) : null;
  const visible = filtered.slice(0, flightUiState.visibleCount);

  if (countEl) {
    countEl.textContent = LANG==='fr'
      ? `${filtered.length} vol${filtered.length>1?'s':''} trouvé${filtered.length>1?'s':''}`
      : `${filtered.length} flight${filtered.length>1?'s':''} found`;
  }

  if (!visible.length) {
    list.innerHTML = `<div class="empty-state">${LANG==='fr' ? 'Aucun vol ne correspond à ce filtre.' : 'No flight matches this filter.'}</div>`;
    if (loadMoreWrap) loadMoreWrap.innerHTML = '';
    return;
  }

  const isReturnPhase = wizState.type==='return' && wizState.tripPhase==='return';
  const selectedFlight = isReturnPhase ? wizState.returnFlight : wizState.flight;
  list.innerHTML = visible.map((f) => {
    const origIndex = currentFlightOptions.indexOf(f);
    const isSelected = selectedFlight && selectedFlight.offerId === f.offerId;
    return `
      <div class="flight-option ${isSelected?'selected':''}" data-i="${origIndex}">
        <div class="fo-avatar" style="background:${airlineColor(f.flightNo)}">${airlineInitials(f.flightNo)}</div>
        <div class="fo-main">
          <div class="fo-route">${formatTime(f.depTime)} <span class="arrow">→</span> ${formatTime(f.arrTime)}</div>
          <div class="fo-meta mono">${f.airline} · ${f.flightNo}</div>
          <div class="fo-badges">
            ${f.durationMin!=null ? `<span class="fo-badge">${formatDuration(f.durationMin)}</span>` : ''}
            <span class="fo-badge">${formatStops(f.stops, LANG)}</span>
            ${Number(f.price)===cheapestPrice ? `<span class="fo-badge best">${LANG==='fr'?'Meilleur prix':'Best price'}</span>` : ''}
          </div>
        </div>
        <div>
          <div class="fo-price">${f.price} ${f.currency || '€'}</div>
          <div class="fo-tag">${t('w4_select')}</div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.flight-option').forEach(el=>{
    el.onclick = ()=>{
      list.querySelectorAll('.flight-option').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      if (isReturnPhase) wizState.returnFlight = currentFlightOptions[+el.dataset.i];
      else wizState.flight = currentFlightOptions[+el.dataset.i];
      document.getElementById('wizNext').disabled = false;
    };
  });

  const remaining = filtered.length - visible.length;
  if (loadMoreWrap) {
    loadMoreWrap.innerHTML = remaining > 0
      ? `<button class="btn btn-outline" id="loadMoreBtn" style="width:100%;margin-top:6px;">${LANG==='fr' ? `Afficher plus (${remaining} restant${remaining>1?'s':''})` : `Show more (${remaining} left)`}</button>`
      : '';
    if (remaining > 0) {
      document.getElementById('loadMoreBtn').onclick = ()=>{ flightUiState.visibleCount += 8; renderFlightList(); };
    }
  }
}

function renderWizard(){
  const app = document.getElementById('app');
  const progress = Array.from({length:WIZ_STEPS}).map((_,i)=>{
    const n=i+1;
    let cls='progress-step';
    if(n<wizState.step) cls+=' done'; else if(n===wizState.step) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  app.innerHTML = `
  <div class="wizard-shell">
    <div class="wizard-top">
      <div class="wrap"><span style="color:rgba(255,255,255,.5);font-size:13px;font-family:'IBM Plex Mono';">
        ${t('w_step')} ${wizState.step} ${t('w_of')} ${WIZ_STEPS}
      </span></div>
    </div>
    <div class="progress-track">${progress}</div>
    <div class="wizard-body" id="wizBody"></div>
  </div>`;
  renderWizStep();
}

function renderWizStep(){
  const body = document.getElementById('wizBody');
  const s = wizState.step;
  const stepLabelEl = document.querySelector('.wizard-top .wrap span');
  if (stepLabelEl) stepLabelEl.textContent = `${t('w_step')} ${s} ${t('w_of')} ${WIZ_STEPS}`;
  document.querySelectorAll('.progress-step').forEach((el,i)=>{
    const n = i+1;
    el.classList.toggle('done', n<s);
    el.classList.toggle('current', n===s);
  });

  if(s===1){
    body.innerHTML = `
      <div class="step-label">${t('w1_label')}</div>
      <h2>${t('w1_title')}</h2>
      <div class="choice-grid">
        <div class="choice-card ${wizState.type==='oneway'?'selected':''}" data-v="oneway"><div class="cc-title">${t('w1_oneway_t')}</div><div class="cc-sub">${t('w1_oneway_s')}</div></div>
        <div class="choice-card ${wizState.type==='return'?'selected':''}" data-v="return"><div class="cc-title">${t('w1_return_t')}</div><div class="cc-sub">${t('w1_return_s')}</div></div>
        <div class="choice-card ${wizState.type==='onward'?'selected':''}" data-v="onward"><div class="cc-title">${t('w1_onward_t')}</div><div class="cc-sub">${t('w1_onward_s')}</div></div>
      </div>
      <div class="wizard-nav"><span></span><button class="btn btn-primary" id="wizNext">${t('nav_next')}</button></div>
    `;
    body.querySelectorAll('.choice-card').forEach(c=>{
      c.onclick = ()=>{ wizState.type=c.dataset.v; renderWizStep(); };
    });
    document.getElementById('wizNext').onclick = ()=>{ wizState.step=2; renderWizStep(); };
  }

  else if(s===2){
    body.innerHTML = `
      <div class="step-label">${t('w2_label')}</div>
      <h2>${t('w2_title')}</h2>
      <div class="form-grid">
        <div class="field-block"><label>${t('w2_from')}</label>
          <select id="fFrom">${CITIES.map(c=>`<option ${c===wizState.from?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field-block"><label>${t('w2_to')}</label>
          <select id="fTo">${CITIES.map(c=>`<option ${c===wizState.to?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field-block ${wizState.type==='return'?'':'full'}"><label>${t('w2_date')}</label>
          <input type="date" id="fDate" value="${wizState.date}"></div>
        ${wizState.type==='return' ? `
        <div class="field-block"><label>${LANG==='fr'?'Date de retour':'Return date'}</label>
          <input type="date" id="fReturnDate" value="${wizState.returnDate}"></div>` : ''}
        <div class="field-block full"><label>${t('w2_existing_pnr')}</label>
          <input type="text" id="fPnr" placeholder="ABC123" value="${wizState.existingPnr}" style="text-transform:uppercase;">
          <span class="hint">${t('w2_existing_pnr_hint')}</span></div>
      </div>
      <div class="wizard-nav">
        <button class="btn btn-outline" id="wizBack">${t('nav_back')}</button>
        <button class="btn btn-primary" id="wizNext">${t('nav_next')}</button>
      </div>
    `;
    document.getElementById('wizBack').onclick = ()=>{ wizState.step=1; renderWizStep(); };
    document.getElementById('wizNext').onclick = ()=>{
      const from = document.getElementById('fFrom').value;
      const to = document.getElementById('fTo').value;
      const date = document.getElementById('fDate').value;

      if (from === to) {
        toast(LANG==='fr' ? 'La ville de départ et de destination doivent être différentes.' : 'Departure and destination city must be different.');
        return;
      }
      if (!date) {
        toast(LANG==='fr' ? 'Merci de choisir une date.' : 'Please choose a date.');
        return;
      }
      const today = new Date().toISOString().slice(0,10);
      if (date < today) {
        toast(LANG==='fr' ? 'La date ne peut pas être dans le passé.' : 'The date cannot be in the past.');
        return;
      }

      let returnDate = wizState.returnDate;
      if (wizState.type === 'return') {
        returnDate = document.getElementById('fReturnDate').value;
        if (!returnDate) {
          toast(LANG==='fr' ? 'Merci de choisir une date de retour.' : 'Please choose a return date.');
          return;
        }
        if (returnDate < date) {
          toast(LANG==='fr' ? 'La date de retour doit être après la date de départ.' : 'The return date must be after the departure date.');
          return;
        }
      }

      wizState.from = from;
      wizState.to = to;
      wizState.date = date;
      wizState.returnDate = returnDate;
      wizState.existingPnr = document.getElementById('fPnr').value.toUpperCase();
      wizState.step=3; renderWizStep();
    };
  }

  else if(s===3){
    body.innerHTML = `
      <div class="step-label">${t('w3_label')}</div>
      <h2>${t('w3_title')}</h2>
      <div class="form-grid">
        <div class="field-block"><label>${t('w3_first')}</label><input type="text" id="fFirst" value="${wizState.firstName}"></div>
        <div class="field-block"><label>${t('w3_last')}</label><input type="text" id="fLast" value="${wizState.lastName}"></div>
        <div class="field-block full"><label>${t('w3_email')}</label><input type="email" id="fEmail" value="${wizState.email}"></div>
        <div class="field-block full"><label>${t('w3_whatsapp')}</label><input type="tel" id="fWhatsapp" placeholder="+212 6 00 00 00 00" value="${wizState.whatsapp}"></div>
        <div class="field-block"><label>${t('w3_birthdate')}</label><input type="date" id="fBirthDate" value="${wizState.birthDate}"></div>
        <div class="field-block"><label>${t('w3_gender')}</label>
          <select id="fGender">
            <option value="m" ${wizState.gender==='m'?'selected':''}>${t('w3_gender_m')}</option>
            <option value="f" ${wizState.gender==='f'?'selected':''}>${t('w3_gender_f')}</option>
          </select></div>
      </div>
      <div class="wizard-nav">
        <button class="btn btn-outline" id="wizBack">${t('nav_back')}</button>
        <button class="btn btn-primary" id="wizNext">${t('nav_next')}</button>
      </div>
    `;
    document.getElementById('wizBack').onclick = ()=>{ wizState.step=2; renderWizStep(); };
    document.getElementById('wizNext').onclick = async ()=>{
      const firstName = document.getElementById('fFirst').value.trim();
      const lastName = document.getElementById('fLast').value.trim();
      const email = document.getElementById('fEmail').value.trim();
      const whatsapp = document.getElementById('fWhatsapp').value.trim();
      const birthDate = document.getElementById('fBirthDate').value;
      const gender = document.getElementById('fGender').value;

      if (!firstName || !lastName) {
        toast(LANG==='fr' ? 'Merci de renseigner votre prénom et votre nom.' : 'Please enter your first and last name.');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        toast(LANG==='fr' ? 'Merci de renseigner une adresse e-mail valide.' : 'Please enter a valid email address.');
        return;
      }
      if (!whatsapp) {
        toast(LANG==='fr' ? 'Merci de renseigner votre numéro WhatsApp.' : 'Please enter your WhatsApp number.');
        return;
      }
      if (!birthDate) {
        toast(LANG==='fr' ? 'Merci de renseigner votre date de naissance.' : 'Please enter your date of birth.');
        return;
      }

      wizState.firstName = firstName;
      wizState.lastName = lastName;
      wizState.email = email;
      wizState.whatsapp = whatsapp;
      wizState.birthDate = birthDate;
      wizState.gender = gender;

      const btn = document.getElementById('wizNext');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = LANG==='fr' ? 'Recherche en cours…' : 'Searching…';
      try {
        const res = await fetch(`${API_BASE}/api/flights/search`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            from: extractIata(wizState.from),
            to: extractIata(wizState.to),
            date: wizState.date,
            passengers: 1,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error || 'search_failed');
        currentFlightOptions = data.offers || [];
        flightUiState = { filter: 'all', sort: 'price', visibleCount: 8 };
        wizState.flight = null;
        wizState.returnFlight = null;
        wizState.tripPhase = 'outbound';
        if (!currentFlightOptions.length) {
          toast(LANG==='fr' ? 'Aucun vol trouvé pour ce trajet/cette date.' : 'No flights found for this route/date.');
          return;
        }
        wizState.step=4; renderWizStep();
      } catch (err) {
        console.error('Erreur recherche de vols :', err);
        toast(LANG==='fr' ? 'Impossible de récupérer les vols. Vérifiez que le backend tourne.' : 'Could not fetch flights. Check that the backend is running.');
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    };
  }

  else if(s===4){
    const isReturnPhase = wizState.type==='return' && wizState.tripPhase==='return';
    const pill = (val, label) => `<button class="pill-btn ${flightUiState.filter===val?'active':''}" data-filter="${val}">${label}</button>`;
    body.innerHTML = `
      <div class="step-label">${t('w4_label')}${wizState.type==='return' ? ' — ' + (isReturnPhase ? (LANG==='fr'?'Vol retour':'Return flight') : (LANG==='fr'?'Vol aller':'Outbound flight')) : ''}</div>
      <h2>${isReturnPhase ? (LANG==='fr'?`Vols disponibles : ${extractIata(wizState.to)} → ${extractIata(wizState.from)}`:`Available flights: ${extractIata(wizState.to)} → ${extractIata(wizState.from)}`) : t('w4_title')}</h2>
      <div class="disclaimer-bar" style="margin-bottom:18px;">ℹ️ <span>${t('w4_demo')}</span></div>
      ${wizState.type==='return' ? `<div class="result-count" style="margin-bottom:14px;">${isReturnPhase ? '2/2 — '+(LANG==='fr'?'sélection du vol retour':'selecting return flight') : '1/2 — '+(LANG==='fr'?'sélection du vol aller':'selecting outbound flight')}</div>` : ''}

        <select id="flightSort" class="sort-select">
          <option value="price" ${flightUiState.sort==='price'?'selected':''}>${LANG==='fr'?'Trier : Prix':'Sort: Price'}</option>
          <option value="duration" ${flightUiState.sort==='duration'?'selected':''}>${LANG==='fr'?'Trier : Durée':'Sort: Duration'}</option>
        </select>
      </div>
      <div id="flightResultCount" class="result-count"></div>
      <div id="flightList"></div>
      <div id="loadMoreWrap"></div>

// Charge un logo compagnie (SVG hébergé par Duffel) et le rasterise en PNG pour jsPDF.
// Renvoie null en cas d'échec (logo absent, CORS, réseau) — le PDF retombe alors sur le badge coloré.
const logoCache = new Map();
function loadAirlineLogoPng(url){
  if (!url) return Promise.resolve(null);
  if (logoCache.has(url)) return logoCache.get(url);
  const p = new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        // Le logo n'est affiché qu'à ~22pt de haut dans le PDF : on limite la résolution
        // du raster (max 160px de large) pour rester net sans alourdir le fichier.
        const naturalW = img.naturalWidth || 200, naturalH = img.naturalHeight || 60;
        const targetW = Math.min(160, naturalW);
        const targetH = Math.round(naturalH * (targetW / naturalW));
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, targetW, targetH);
        resolve({ dataUrl: canvas.toDataURL('image/png'), w: naturalW, h: naturalH });
      }catch(e){ resolve(null); }
    };
    img.onerror = ()=> resolve(null);
    img.src = url;
  });
  logoCache.set(url, p);
  return p;
}

  const legs = hasReturn ? [

    { title: LANG==='fr'?'2. Vol retour':'2. Return', from:b.returnFrom, to:b.returnTo, date:b.returnDate, pnr:b.returnPnr, flightNo:b.returnFlightNo, airline:b.returnAirline, logoUrl:b.returnAirlineLogo, depTime:b.returnDepTime, arrTime:b.returnArrTime, durationMin:b.returnDurationMin, originAirportName:b.returnOriginAirportName, destinationAirportName:b.returnDestinationAirportName, originTerminal:b.returnOriginTerminal, destinationTerminal:b.returnDestinationTerminal, aircraft:b.returnAircraft },
  ] : [
    { title: LANG==='fr'?'Votre vol':'Your flight', from:b.from, to:b.to, date:b.date, pnr:b.pnr, flightNo:b.flightNo, airline:b.airline, logoUrl:b.airlineLogo, depTime:b.depTime, arrTime:b.arrTime, durationMin:b.durationMin, originAirportName:b.originAirportName, destinationAirportName:b.destinationAirportName, originTerminal:b.originTerminal, destinationTerminal:b.destinationTerminal, aircraft:b.aircraft },
  ];
  const legLogos = await Promise.all(legs.map(leg => loadAirlineLogoPng(leg.logoUrl)));

  /* ================= EN-TÊTE ================= */
  doc.setFillColor(255,255,255);
  doc.rect(0,0,PAGE_W,118,'F');
  try{ doc.addImage(LOGO_URI,'PNG',MARGIN,26,56,48); }catch(e){}
  doc.setTextColor(...petrol);
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('SKYLINK VOYAGES', MARGIN+68, 50);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...goldDark);
  doc.text(t('tagline'), MARGIN+68, 66);

  const contactLines = [
    ...(SKYLINK_CONTACT.address.length ? [{ text: SKYLINK_CONTACT.address.join(', '), icon: drawPin }] : []),
    ...(SKYLINK_CONTACT.phones.length ? [{ text: SKYLINK_CONTACT.phones.join(' / '), icon: drawPhone }] : []),
    ...(SKYLINK_CONTACT.email ? [{ text: SKYLINK_CONTACT.email, icon: drawEnvelope }] : []),
    ...(SKYLINK_CONTACT.website ? [{ text: SKYLINK_CONTACT.website, icon: drawGlobe }] : []),
  ];
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  contactLines.forEach((c,i)=>{
    const isWebsite = SKYLINK_CONTACT.website && c.text === SKYLINK_CONTACT.website;
    const col = isWebsite ? goldDark : inkSoft;
    doc.setTextColor(...col);
    const ty = 24 + i*13;
    const tw = doc.getTextWidth(c.text);
    doc.text(c.text, PAGE_W-MARGIN, ty, {align:'right'});
    c.icon(PAGE_W-MARGIN-tw-11, ty-3, 8, col);
  });

  doc.setDrawColor(...gold); doc.setLineWidth(1.5);
  doc.line(MARGIN, 92, PAGE_W-MARGIN, 92);
  doc.setDrawColor(...line); doc.setLineWidth(1);
  doc.line(0,118,PAGE_W,118);

  /* ================= TITRE + RÉFÉRENCE GLOBALE ================= */
  let y = 118;
  drawPlaneTri(MARGIN+8, y+30, 13, gold);
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...petrol);
  doc.text((hasReturn ? (LANG==='fr'?'Itinéraire / Confirmation de réservation':'Itinerary / Booking confirmation') : t('doc_title')).toUpperCase(), MARGIN+24, y+34, {maxWidth: 280});

  const refBoxW = 168, refBoxH = 40, refBoxX = PAGE_W-MARGIN-refBoxW, refBoxY = y+8;
  doc.setFillColor(...petrol);
  doc.roundedRect(refBoxX, refBoxY, refBoxW, refBoxH, 6, 6, 'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...goldLite);
  doc.text((LANG==='fr'?'RÉFÉRENCE GLOBALE':'GLOBAL REFERENCE').toUpperCase(), refBoxX+refBoxW/2, refBoxY+15, {align:'center'});
  doc.setFont('courier','bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
  doc.text(`SV-${b.id || b.pnr}`, refBoxX+refBoxW/2, refBoxY+31, {align:'center'});

  y += 62;

  /* ================= BANDEAU PASSAGER (4 colonnes) ================= */
  const passH = 62;
  doc.setDrawColor(...line); doc.setLineWidth(1);
  doc.roundedRect(MARGIN, y, PAGE_W-2*MARGIN, passH, 8, 8, 'S');
  const orderRef = (b.orderId || b.id || '').toString().slice(-10).toUpperCase();
  const passCols = [
    { icon: drawPerson, label: t('passenger'), value: `${b.firstName} ${b.lastName}` },
    { icon: drawSeat, label: LANG==='fr'?'Classe':'Class', value: b.cabinClass || 'Economy' },
    { icon: drawTicket, label: LANG==='fr'?'N° de dossier':'Booking ref.', value: orderRef },
    { icon: drawTicket, label: LANG==='fr'?'PNR aller':'Outbound PNR', value: b.pnr },
  ];
  const colW4 = (PAGE_W-2*MARGIN)/4;
  passCols.forEach((c,i)=>{
    const cx0 = MARGIN + i*colW4;
    c.icon(cx0+22, y+25, 15, gold);
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...inkSoft);
    doc.text(c.label.toUpperCase(), cx0+38, y+21, {maxWidth: colW4-46});
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ink);
    doc.text(String(c.value), cx0+38, y+36, {maxWidth: colW4-46});
    if (i>0){ doc.setDrawColor(...line); doc.setLineWidth(0.7); doc.line(cx0, y+10, cx0, y+passH-10); }
  });
  y += passH + 14;

  /* ================= PNR ALLER / RETOUR (aller-retour uniquement) ================= */
  if (hasReturn) {
    const pnrH = 54;
    doc.setDrawColor(...line); doc.setLineWidth(1);
    doc.roundedRect(MARGIN, y, PAGE_W-2*MARGIN, pnrH, 8, 8, 'S');
    const halfW = (PAGE_W-2*MARGIN)/2;
    doc.line(MARGIN+halfW, y+10, MARGIN+halfW, y+pnrH-10);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...inkSoft);
    doc.text((LANG==='fr'?'PNR ALLER':'OUTBOUND PNR'), MARGIN+halfW/2, y+18, {align:'center'});
    doc.text((LANG==='fr'?`PNR RETOUR (${(b.returnAirline||'').toUpperCase()})`:`RETURN PNR (${(b.returnAirline||'').toUpperCase()})`), MARGIN+halfW+halfW/2, y+18, {align:'center', maxWidth: halfW-20});
    doc.setFont('courier','bold'); doc.setFontSize(17); doc.setTextColor(...petrol);
    doc.text(b.pnr, MARGIN+halfW/2, y+40, {align:'center'});
    doc.text(b.returnPnr, MARGIN+halfW+halfW/2, y+40, {align:'center'});
    y += pnrH + 16;
  }

  /* ================= PANNEAUX DE VOL ================= */
  const gap = hasReturn ? 16 : 0;
  const panelW = hasReturn ? (PAGE_W-2*MARGIN-gap)/2 : PAGE_W-2*MARGIN;
  const panelH = 238;
  const barH = 24;

  legs.forEach((leg, li)=>{
    const px = MARGIN + li*(panelW+gap);
    const barBg = li===1 ? gold : petrol;
    const barFg = li===1 ? petrol : [255,255,255];
    const barIconColor = li===1 ? petrol : gold;

    doc.setDrawColor(...line); doc.setLineWidth(1);
    doc.roundedRect(px, y, panelW, panelH, 8, 8, 'S');
    doc.setFillColor(...barBg);
    doc.roundedRect(px, y, panelW, barH, 8, 8, 'F');
    doc.rect(px, y+barH-8, panelW, 8, 'F');
    drawPlaneTri(px+16, y+barH/2, 11, barIconColor);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...barFg);
    doc.text(leg.title.toUpperCase(), px+30, y+barH/2+3.5);
    doc.setFont('courier','bold'); doc.setFontSize(8.5); doc.setTextColor(...barFg);
    doc.text(leg.flightNo, px+panelW-14, y+barH/2+3.5, {align:'right'});

    let ly = y+barH+16;
    const logo = legLogos[li];
    if (logo && logo.dataUrl) {
      const lh = 20, lw = Math.min(32, lh * (logo.w / logo.h || 1));
      try { doc.addImage(logo.dataUrl, 'PNG', px+16, ly-14, lw, lh); } catch(e){}
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ink);
      doc.text(String(leg.airline), px+16+lw+10, ly-4, {maxWidth:panelW-lw-42});
    } else {
      const alColor = hexToRgb(airlineColor(leg.flightNo));
      doc.setFillColor(...alColor);
      doc.circle(px+25, ly-8, 10, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text(airlineInitials(leg.flightNo), px+25, ly-5, {align:'center'});
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ink);
      doc.text(String(leg.airline), px+42, ly-4, {maxWidth:panelW-58});
    }

    ly += 28;
    const fCode = extractIata(leg.from), tCode = extractIata(leg.to);
    doc.setFont('helvetica','bold'); doc.setFontSize(hasReturn?18:24); doc.setTextColor(...petrol);
    doc.text(fCode, px+16, ly);
    const tX = px+panelW-16;
    doc.text(tCode, tX, ly, {align:'right'});
    const lineFromX = px+16+doc.getTextWidth(fCode)+8;
    const lineToX = tX-doc.getTextWidth(tCode)-14;
    if (lineToX > lineFromX){
      doc.setDrawColor(...gold); doc.setLineWidth(1);
      doc.setLineDashPattern([2,2], 0);
      doc.line(lineFromX, ly-6, lineToX, ly-6);
      doc.setLineDashPattern([], 0);
      doc.setFillColor(...gold);
      doc.triangle(lineToX-6,ly-11, lineToX-6,ly-1, lineToX+3,ly-6, 'F');
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...inkSoft);
    doc.text(String(leg.from), px+16, ly+11, {maxWidth: panelW/2-20});
    doc.text(String(leg.to), tX, ly+11, {align:'right', maxWidth: panelW/2-20});
    if (leg.originAirportName || leg.destinationAirportName){
      doc.setFontSize(6.5);
      const origLabel = (leg.originAirportName||'').toUpperCase() + (leg.originTerminal?` (T${leg.originTerminal})`:'');
      const destLabel = (leg.destinationAirportName||'').toUpperCase() + (leg.destinationTerminal?` (T${leg.destinationTerminal})`:'');
      if (origLabel) doc.text(origLabel, px+16, ly+21, {maxWidth: panelW/2-20});
      if (destLabel) doc.text(destLabel, tX, ly+21, {align:'right', maxWidth: panelW/2-20});
    }

    ly += 34;
    doc.setDrawColor(...line); doc.setLineWidth(0.7);
    doc.line(px+16, ly, px+panelW-16, ly);
    ly += 16;
    const col3W = (panelW-32)/3;
    const dateCol = [px+16, px+16+col3W, px+16+col3W*2];
    doc.setFont('helvetica','bold'); doc.setFontSize(6.8); doc.setTextColor(...inkSoft);
    drawCalendar(dateCol[0]+6, ly-3, 8, gold); doc.text(t('w5_date').toUpperCase(), dateCol[0]+15, ly);
    drawClock(dateCol[1]+6, ly-3, 8, gold); doc.text((LANG==='fr'?'DÉPART':'DEPART'), dateCol[1]+15, ly);
    drawClock(dateCol[2]+6, ly-3, 8, gold); doc.text((LANG==='fr'?'ARRIVÉE':'ARRIVAL'), dateCol[2]+15, ly);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...ink);
    doc.text(String(leg.date), dateCol[0]+15, ly+13);
    doc.text(leg.depTime ? formatTime(leg.depTime) : '—', dateCol[1]+15, ly+13);
    doc.text(leg.arrTime ? formatTime(leg.arrTime) : '—', dateCol[2]+15, ly+13);

    ly += 28;
    if (leg.aircraft || leg.durationMin!=null){
      doc.setDrawColor(...line); doc.setLineWidth(0.7);
      doc.line(px+16, ly, px+panelW-16, ly);
      ly += 16;
      doc.setFont('helvetica','bold'); doc.setFontSize(6.8); doc.setTextColor(...inkSoft);
      doc.text((LANG==='fr'?'APPAREIL':'AIRCRAFT'), px+16, ly);
      doc.text((LANG==='fr'?'DURÉE DU VOL':'FLIGHT TIME'), px+panelW/2+4, ly);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...ink);
      doc.text(leg.aircraft || '—', px+16, ly+12, {maxWidth: panelW/2-24});
      doc.text(leg.durationMin!=null ? formatDuration(leg.durationMin) : '—', px+panelW/2+4, ly+12);
    }

    drawSkyline(px+14, y+panelH-12, panelW-28, [220,225,222]);
  });

  y += panelH + 18;

  /* ================= BAGAGES INCLUS + INFORMATIONS IMPORTANTES ================= */
  const boxH = 130;
  const boxGap = 16;
  const boxW = (PAGE_W-2*MARGIN-boxGap)/2;

  const renderBagRow = (bx, by, cabinN, checkedN) => {
    drawBagIcon(bx+10, by, 12, cabinN?gold:line);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...(cabinN?ink:inkSoft));
    doc.text(cabinN ? `${cabinN} ${LANG==='fr'?'bagage cabine':'cabin bag'}${cabinN>1?'s':''}` : (LANG==='fr'?'Cabine non incluse':'No cabin bag'), bx+22, by+3, {maxWidth: boxW/2-30});
    const bx2 = bx + boxW/2 - 6;
    drawBagIcon(bx2+10, by, 12, checkedN?gold:line);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...(checkedN?ink:inkSoft));
    doc.text(checkedN ? `${checkedN} ${LANG==='fr'?'bagage en soute':'checked bag'}${checkedN>1?'s':''}` : (LANG==='fr'?'Soute non incluse':'No checked bag'), bx2+22, by+3, {maxWidth: boxW/2-30});
  };

  const bagX = MARGIN;
  doc.setDrawColor(...line); doc.setLineWidth(1);
  doc.roundedRect(bagX, y, boxW, boxH, 8, 8, 'S');
  doc.setFillColor(...petrol);
  doc.roundedRect(bagX, y, boxW, 24, 8, 8, 'F');
  doc.rect(bagX, y+16, boxW, 8, 'F');
  drawBagIcon(bagX+16, y+13, 13, [255,255,255]);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
  doc.text((LANG==='fr'?'BAGAGES INCLUS':'INCLUDED BAGGAGE'), bagX+28, y+16);

  if (hasReturn) {
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...inkSoft);
    doc.text((LANG==='fr'?'VOL ALLER':'OUTBOUND'), bagX+16, y+42);
    renderBagRow(bagX+16, y+58, b.cabinBags||0, b.checkedBags||0);
    doc.text((LANG==='fr'?'VOL RETOUR':'RETURN'), bagX+16, y+82);
    renderBagRow(bagX+16, y+98, b.returnCabinBags||0, b.returnCheckedBags||0);
  } else {
    renderBagRow(bagX+16, y+64, b.cabinBags||0, b.checkedBags||0);
  }

  const infoX = MARGIN+boxW+boxGap;
  doc.setDrawColor(...line); doc.setLineWidth(1);
  doc.roundedRect(infoX, y, boxW, boxH, 8, 8, 'S');
  doc.setFillColor(...gold);
  doc.roundedRect(infoX, y, boxW, 24, 8, 8, 'F');
  doc.rect(infoX, y+16, boxW, 8, 'F');
  drawInfoCircle(infoX+16, y+13, 13, petrol);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...petrol);
  doc.text((LANG==='fr'?'INFORMATIONS IMPORTANTES':'IMPORTANT INFORMATION'), infoX+28, y+16);

  const infoItems = LANG==='fr' ? [
    "Présentez-vous à l'aéroport au moins 3h avant le départ.",
    "Pièce d'identité ou passeport valide requis.",
    'Vérifiez horaires et terminal avant le voyage.',
    `Confirmation envoyée à : ${b.email || '—'}`,
  ] : [
    'Arrive at least 3h before departure.',
    'Valid ID or passport required.',
    'Double-check times and terminal before travel.',
    `Confirmation sent to: ${b.email || '—'}`,
  ];
  let infoY = y+40;
  infoItems.forEach(item=>{
    drawCheck(infoX+20, infoY-3, gold);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(...ink);
    doc.text(item, infoX+32, infoY, {maxWidth: boxW-46});
    infoY += 24;
  });

  y += boxH + 16;

  /* ================= PIED DE PAGE ================= */
  const footTop = PAGE_H - 74;
  doc.setDrawColor(...gold); doc.setLineWidth(1);
  doc.line(MARGIN, footTop, PAGE_W-MARGIN, footTop);

  const services = LANG==='fr' ? [
    [(LANG==='fr'?'Billetterie avion':'Flight tickets'), drawTicket],
    [(LANG==='fr'?'Séjours & vacances':'Trips & vacations'), drawBagIcon],
    [(LANG==='fr'?'Tourisme & excursions':'Tourism & excursions'), drawGlobe],
    [(LANG==='fr'?'Visa & assistance':'Visa & assistance'), drawPin],
    [(LANG==='fr'?'Service client 24/7':'24/7 customer service'), drawPhone],
  ] : [
    ['Flight tickets', drawTicket], ['Trips & vacations', drawBagIcon],
    ['Tourism & excursions', drawGlobe], ['Visa & assistance', drawPin],
    ['24/7 customer service', drawPhone],
  ];
  const svcW = (PAGE_W-2*MARGIN)/services.length;
  services.forEach(([label, icon], i)=>{
    const cx = MARGIN + svcW*i + svcW/2;
    icon(cx, footTop+20, 13, gold);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(...petrol);
    doc.text(label.toUpperCase(), cx, footTop+36, {align:'center', maxWidth: svcW-8});
  });

  doc.setFillColor(...petrol);
  doc.rect(0, PAGE_H-20, PAGE_W, 20, 'F');
  drawPlaneTri(MARGIN+8, PAGE_H-10, 9, gold);
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(255,255,255);
  doc.text((LANG==='fr'?'Votre partenaire de confiance pour tous vos voyages':'Your trusted partner for all your travels'), PAGE_W/2, PAGE_H-7, {align:'center'});
  drawPlaneTri(PAGE_W-MARGIN-8, PAGE_H-10, 9, gold);

  doc.save(`skylink-reservation-${b.pnr}${hasReturn?'-'+b.returnPnr:''}.pdf`);
  toast(t('toast_pdf'));
}

        </div>

        generatePdf(bk);
      };
    });
  }
});

        </div>

        <div class="stat-grid">
          <div class="stat-card"><div class="sc-label">${t('ad_total_bookings')}</div><div class="sc-value">${db.length}</div><div class="sc-delta up">▲ 12%</div></div>
          <div class="stat-card"><div class="sc-label">${t('ad_active')}</div><div class="sc-value">${active}</div><div class="sc-delta up">▲ 5%</div></div>
          <div class="stat-card"><div class="sc-label">${t('ad_revenue')}</div><div class="sc-value">${revenue} €</div><div class="sc-delta up">▲ 18%</div></div>
          <div class="stat-card"><div class="sc-label">${t('ad_conv')}</div><div class="sc-value">64%</div><div class="sc-delta down">▼ 2%</div></div>
        </div>

        <div class="panel">
          <div style="padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
            <h3 style="font-size:16px;">${t('ad_recent')}</h3>
          </div>
          <div class="toolbar" style="padding:16px 22px 0;">
            <input type="text" placeholder="${t('ad_search')}" style="flex:1;">
            <select><option>${t('ad_status_all')}</option>
              <option>${t('status_confirmed')}</option><option>${t('status_paid')}</option>
              <option>${t('status_searching')}</option><option>${t('status_expired')}</option></select>
          </div>
          <div style="padding:16px 22px 22px;overflow:auto;">
          <table class="data-table">
            <thead><tr>
              <th>${t('th_client')}</th><th>${t('th_route')}</th><th>${t('th_pnr')}</th>
              <th>${t('th_created')}</th><th>${t('th_expiry')}</th><th>${t('th_status')}</th>
            </tr></thead>
            <tbody>
              ${db.map(b=>`
                <tr>
                  <td>${b.firstName} ${b.lastName}</td>
                  <td>${b.from.split(' (')[0]} → ${b.to.split(' (')[0]}</td>
                  <td class="mono">${b.pnr}</td>
                  <td>${fmtDateTime(b.createdAt)}</td>
                  <td>${fmtDateTime(b.expiresAt)}</td>
                  <td>${statusBadge(b.status)}</td>
                </tr>
              `).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:24px;">—</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.as-link').forEach(link=>{
    link.onclick = (e)=>{
      e.preventDefault();
      document.querySelectorAll('.as-link').forEach(l=>l.classList.remove('active'));
      link.classList.add('active');
      document.getElementById('adTitle').textContent = t(link.dataset.k);
    };
  });
});

/* ---------------- boot ---------------- */
navigate();
</script>
</body>
</html>
